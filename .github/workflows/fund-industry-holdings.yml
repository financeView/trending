name: fund-industry-holdings

on:
  # 11:00 Beijing on Apr/May/Sep/Nov 1: after annual, Q1, semiannual, and Q3 disclosure windows.
  # GitHub requires schedule/workflow_dispatch files on the default branch; this branch-only workflow stays inactive until then.
  schedule:
    - cron: '0 3 1 4,5,9,11 *'
  workflow_dispatch:
    inputs:
      industry_l1:
        description: "选择仓库一级行业（静态列表；二级行业需在下方输入）"
        required: true
        type: choice
        options:
          - "l1_health | 医药健康"
          - "l1_tech_hw | 科技硬件"
          - "l1_internet_media | 互联网与传媒"
          - "l1_agri | 农林"
          - "l1_staples | 食品饮料"
          - "l1_discretionary | 可选消费"
          - "l1_manufacturing | 制造与军工"
          - "l1_power_equip | 电新设备"
          - "l1_transport_env | 交运与环保"
          - "l1_energy_util | 能源与公用事业"
          - "l1_materials | 材料与资源"
          - "l1_property_infra | 地产基建"
          - "l1_finance | 金融"
          - "l1_diversified | 综合与商业服务"
      industry_l2:
        description: "输入所选一级行业下的申万2021二级行业代码或精确名称，例如 370100 或 化学制药；工作流会校验父子关系"
        required: true
        type: string
      report_date:
        description: "可选：报告期 YYYYMMDD；留空自动选择最近已披露季度"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: fund-industry-holdings
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      INDUSTRY_L1: ${{ inputs.industry_l1 }}
      INDUSTRY_L2: ${{ inputs.industry_l2 }}
      REPORT_DATE: ${{ inputs.report_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-fund-industry.txt

      - name: Install dependencies
        run: pip install -r requirements-fund-industry.txt

      - name: Unit tests
        run: python -m pytest tests/test_fund_industry.py tests/test_fund_industry_tls.py -q

      - name: Aggregate latest public holdings
        id: report
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            python -m scripts.run_fund_industry --all-industries --report-date "$REPORT_DATE"
          else
            python -m scripts.run_fund_industry \
              --industry-l1 "$INDUSTRY_L1" \
              --industry-l2 "$INDUSTRY_L2" \
              --report-date "$REPORT_DATE"
          fi

      - name: Add report to run summary
        run: cat "${{ steps.report.outputs.report_markdown }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate report
        uses: actions/upload-artifact@v4
        with:
          name: fund-industry-${{ github.run_id }}
          path: |
            ${{ steps.report.outputs.report_json }}
            ${{ steps.report.outputs.report_markdown }}
            ${{ steps.report.outputs.report_history }}
            ${{ steps.report.outputs.report_chart }}
          if-no-files-found: error
          retention-days: 90

      - name: Commit aggregate snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.report.outputs.report_json }}" "${{ steps.report.outputs.report_markdown }}"
          if [ -n "${{ steps.report.outputs.report_history }}" ]; then
            git add "${{ steps.report.outputs.report_history }}" "${{ steps.report.outputs.report_chart }}"
          fi
          if git diff --staged --quiet; then
            echo "aggregate snapshot unchanged"
          else
            git commit -m "data: fund industry holdings $REPORT_DATE"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF"
          fi
