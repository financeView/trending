name: daily-trend

# 北京 19:00 = UTC 11:00（等 BaoStock 日K/复权）；见 market-data-contract

on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      force_trade_day:
        description: "跳过交易日历检查（非交易日测试用）"
        required: false
        type: boolean
        default: false
      date:
        description: "重跑起点 YYYY-MM-DD（空=cron：asof=最近交易日，无 --date）"
        required: false
        type: string
        default: ""
      only_date:
        description: "与 date 联用：只跑该日（单日补洞）"
        required: false
        type: boolean
        default: false
      skip_issue_update:
        description: "跳过 L1/Radar Issue 更新"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-trend
  cancel-in-progress: false

jobs:
  trend:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BARS_SOURCE: sina
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore bars cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: bars-${{ github.run_id }}
          restore-keys: bars-

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Refresh taxonomy YAML
        id: taxonomy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/taxonomy/refresh_taxonomy.py --git
          # always exit 0; writes taxonomy_fetch= / taxonomy_head_sha= to GITHUB_OUTPUT

      - name: Sync mapped-universe bars
        id: sync
        timeout-minutes: 330
        run: |
          DATE="${{ github.event.inputs.date }}"
          ONLY="${{ github.event.inputs.only_date }}"
          if [ "$ONLY" = "true" ] && [ -z "$DATE" ]; then
            echo "[sync] only_date requires date" >&2
            exit 1
          fi
          # stderr for calendar warn; stdout must be a bare YYYY-MM-DD
          ASOF=$(python -c "from scripts.common.calendar import latest_trade_day; print(latest_trade_day().isoformat())" 2>/dev/null)
          END="$ASOF"
          LIMIT_ARGS=(--with-limits)
          BUDGET=200
          if [ -n "$DATE" ] && [ "$ONLY" = "true" ]; then
            END="$DATE"
            BUDGET=300
            if [ "$DATE" != "$ASOF" ]; then
              LIMIT_ARGS=()
              echo "[sync] skip --with-limits (only_date=$DATE != asof $ASOF)"
            fi
          elif [ -n "$DATE" ]; then
            echo "[sync] catch-up from $DATE end=$ASOF"
          else
            echo "[sync] cron end=$ASOF"
          fi
          python scripts/sync_bars_sample.py \
            --end "$END" \
            --time-budget-min "$BUDGET" \
            "${LIMIT_ARGS[@]}"

      - name: daily_run
        if: ${{ success() && steps.sync.outputs.sync_complete == 'true' && steps.sync.outputs.run_deferred != 'true' }}
        timeout-minutes: 120
        env:
          TAXONOMY_HEAD_SHA: ${{ steps.taxonomy.outputs.taxonomy_head_sha }}
          TAXONOMY_FETCH: ${{ steps.taxonomy.outputs.taxonomy_fetch }}
        run: |
          DATE="${{ github.event.inputs.date }}"
          ONLY="${{ github.event.inputs.only_date }}"
          FORCE=""
          if [ "${{ github.event.inputs.force_trade_day }}" = "true" ]; then
            FORCE="--force-trade-day"
          fi
          ONLY_ARG=""
          if [ "$ONLY" = "true" ] && [ -n "$DATE" ]; then
            ONLY_ARG="--only-date"
          fi
          python scripts/daily_run.py ${DATE:+--date $DATE} $ONLY_ARG $FORCE

      - name: live_shadow
        if: ${{ success() && steps.sync.outputs.sync_complete == 'true' && steps.sync.outputs.run_deferred != 'true' }}
        run: |
          DATE="${{ github.event.inputs.date }}"
          ONLY="${{ github.event.inputs.only_date }}"
          if [ "$ONLY" = "true" ] && [ -n "$DATE" ]; then
            python scripts/eval/live_shadow_step.py --asof "$DATE"
          else
            python scripts/eval/live_shadow_step.py --from-heartbeat
          fi

      - name: Commit trend.db + heartbeat
        if: ${{ success() && steps.sync.outputs.sync_complete == 'true' && steps.sync.outputs.run_deferred != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trend.db data/heartbeat.json || true
          if git diff --staged --quiet; then
            echo "no db changes"
          else
            git commit -m "chore: daily trend.db $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi

      - name: Update L1 / Radar Issues
        if: ${{ github.event.inputs.skip_issue_update != 'true' && success() && steps.sync.outputs.sync_complete == 'true' && steps.sync.outputs.run_deferred != 'true' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          DATE="${{ github.event.inputs.date }}"
          ONLY="${{ github.event.inputs.only_date }}"
          # only_date: publish that day. Catch-up / cron: last processed day in heartbeat.
          if [ "$ONLY" = "true" ] && [ -n "$DATE" ]; then
            python scripts/issues/update_l1_issues.py --date "$DATE" --live
          else
            python scripts/issues/update_l1_issues.py --from-heartbeat --live
          fi
