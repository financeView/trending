name: daily-trend

# 北京 19:00 = UTC 11:00（等 BaoStock 日K/复权）；见 market-data-contract

on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      force_trade_day:
        description: "跳过交易日历检查（非交易日测试用）"
        required: false
        type: boolean
        default: false
      date:
        description: "指定交易日 YYYY-MM-DD（留空=最近交易日）"
        required: false
        type: string
        default: ""
      skip_issue_update:
        description: "跳过 L1/Radar Issue 更新"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-trend
  cancel-in-progress: false

jobs:
  trend:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BARS_SOURCE: sina
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore bars cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: bars-${{ github.run_id }}
          restore-keys: bars-

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Sync stub-universe bars
        timeout-minutes: 60
        run: |
          DATE="${{ github.event.inputs.date }}"
          END_ARGS=()
          if [ -n "$DATE" ]; then
            END_ARGS=(--end "$DATE")
          fi
          # Real coverage denominator = universe_stub members (not full A-share).
          python scripts/sync_bars_sample.py \
            --from-universe config/taxonomy/universe_stub.yaml \
            --with-limits \
            "${END_ARGS[@]}"

      - name: daily_run
        timeout-minutes: 120
        run: |
          DATE="${{ github.event.inputs.date }}"
          FORCE=""
          if [ "${{ github.event.inputs.force_trade_day }}" = "true" ]; then
            FORCE="--force-trade-day"
          fi
          # P1: real coverage over synced stub universe (no --stub-coverage).
          python scripts/daily_run.py ${DATE:+--date $DATE} $FORCE

      - name: Commit trend.db + heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trend.db data/heartbeat.json || true
          if git diff --staged --quiet; then
            echo "no db changes"
          else
            git commit -m "chore: daily trend.db $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi

      - name: Update L1 / Radar Issues
        if: ${{ github.event.inputs.skip_issue_update != 'true' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # After commit: Issues are a view. Failures must not drop trend.db.
          DATE="${{ github.event.inputs.date }}"
          if [ -n "$DATE" ]; then
            python scripts/issues/update_l1_issues.py --date "$DATE" --live
          else
            python scripts/issues/update_l1_issues.py --from-heartbeat --live
          fi
