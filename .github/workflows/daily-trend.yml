name: daily-trend

# 北京 19:00 = UTC 11:00（等 BaoStock 日K/复权）；见 market-data-contract

on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      force_trade_day:
        description: "跳过交易日历检查（非交易日测试用）"
        required: false
        type: boolean
        default: false
      date:
        description: "指定交易日 YYYY-MM-DD（留空=最近交易日）"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-trend
  cancel-in-progress: false

jobs:
  trend:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BARS_SOURCE: sina
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore bars cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: bars-${{ github.run_id }}
          restore-keys: bars-

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: daily_run
        timeout-minutes: 120
        run: |
          DATE="${{ github.event.inputs.date }}"
          FORCE=""
          if [ "${{ github.event.inputs.force_trade_day }}" = "true" ]; then
            FORCE="--force-trade-day"
          fi
          # P0.5: real coverage from bars when present; stub keeps Actions green
          # until full-universe sync lands in this workflow.
          python scripts/daily_run.py ${DATE:+--date $DATE} $FORCE --stub-coverage

      - name: Commit trend.db + heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trend.db data/heartbeat.json || true
          if git diff --staged --quiet; then
            echo "no db changes"
          else
            git commit -m "chore: daily trend.db $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi
